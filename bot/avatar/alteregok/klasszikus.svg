<?xml version="1.0" encoding="UTF-8"?>
<!--
  Klasszikus — a Házirobot eredeti, fehér avatarja.

  A minta a "Magyarok az űrben 1. rész" (Dik Tafon, 2013) 6:10–6:40 közötti
  képkockája: ott a háttérben egy fehér/szürke robot látható a két egyenruhás
  alak között. A videó csak 160x90-es storyboard-felbontásban érhető el, ezért
  ez a rajz abból mintázva, saját, vektoros és animált változat.

  Mozgás: lebegés, pislogás, integetés, antenna-pulzus, mellkasi fények.
  Ez az alteregó a visszafelé kompatibilis: ugyanaz, mint a régi avatar.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="Klasszikus">
  <defs>
    <linearGradient id="kl-feher" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eef2f6"/>
      <stop offset="100%" stop-color="#cfd8e3"/>
    </linearGradient>
    <linearGradient id="kl-fej" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dde5ee"/>
    </linearGradient>
    <radialGradient id="kl-sotet" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3b4b60"/>
      <stop offset="100%" stop-color="#141b24"/>
    </radialGradient>
    <filter id="kl-lagy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .lebeg { animation: lebeg 3.4s ease-in-out infinite; }
    @keyframes lebeg { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    .szem { transform-box: fill-box; transform-origin: center; animation: pislog 5.2s ease-in-out infinite; }
    @keyframes pislog { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }

    .kl-antenna { animation: kl-pulzus 2.2s ease-in-out infinite; }
    @keyframes kl-pulzus { 0%,100% { r: 6; opacity: .95; } 50% { r: 8; opacity: .55; } }

    .kl-kar-jobb { transform-box: view-box; transform-origin: 158px 176px; animation: kl-integer 2.8s ease-in-out infinite; }
    @keyframes kl-integer { 0%,100% { transform: rotate(-6deg); } 45% { transform: rotate(22deg); } 60% { transform: rotate(14deg); } }

    .kl-kar-bal { transform-box: view-box; transform-origin: 82px 176px; animation: kl-himl 4.2s ease-in-out infinite; }
    @keyframes kl-himl { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-4deg); } }

    .kl-feny1 { animation: kl-feny 1.8s steps(1) infinite; }
    .kl-feny2 { animation: kl-feny 1.8s steps(1) .6s infinite; }
    .kl-feny3 { animation: kl-feny 1.8s steps(1) 1.2s infinite; }
    @keyframes kl-feny { 0%,70% { opacity: .25; } 71%,100% { opacity: 1; } }

    .kl-csillan { animation: kl-villan 4s linear infinite; }
    @keyframes kl-villan { 0% { transform: translateX(-26px); opacity: 0; } 8% { opacity: .5; } 22% { transform: translateX(26px); opacity: 0; } 100% { opacity: 0; } }
  </style>

  <!-- talajárnyék -->
  <ellipse cx="120" cy="292" rx="62" ry="10" fill="#000" opacity="0.28"/>

  <g class="lebeg">
    <!-- lábak / lánctalp -->
    <rect x="66" y="252" width="108" height="30" rx="15" fill="url(#kl-feher)" stroke="#aab6c5" stroke-width="2"/>
    <circle cx="86" cy="267" r="9" fill="#8d9bab"/><circle cx="104" cy="267" r="9" fill="#a7b4c4"/>
    <circle cx="136" cy="267" r="9" fill="#a7b4c4"/><circle cx="154" cy="267" r="9" fill="#8d9bab"/>

    <!-- törzs -->
    <rect x="72" y="164" width="96" height="96" rx="26" fill="url(#kl-feher)" stroke="#aab6c5" stroke-width="2"/>
    <rect x="92" y="186" width="56" height="34" rx="8" fill="url(#kl-sotet)"/>
    <rect x="99" y="193" width="14" height="8" rx="3" fill="#5eead4" class="kl-feny1"/>
    <rect x="119" y="193" width="14" height="8" rx="3" fill="#fbbf24" class="kl-feny2"/>
    <rect x="99" y="206" width="34" height="6" rx="3" fill="#93c5fd" class="kl-feny3"/>
    <circle cx="140" cy="209" r="4" fill="#f87171" class="kl-feny2"/>

    <!-- bal kar -->
    <g class="kl-kar-bal">
      <rect x="58" y="172" width="20" height="58" rx="10" fill="url(#kl-feher)" stroke="#aab6c5" stroke-width="2"/>
      <circle cx="68" cy="238" r="12" fill="url(#kl-feher)" stroke="#aab6c5" stroke-width="2"/>
    </g>

    <!-- jobb kar (integet) -->
    <g class="kl-kar-jobb">
      <rect x="162" y="150" width="20" height="62" rx="10" fill="url(#kl-feher)" stroke="#aab6c5" stroke-width="2"/>
      <circle cx="172" cy="146" r="13" fill="url(#kl-feher)" stroke="#aab6c5" stroke-width="2"/>
      <path d="M166 136 q6 -8 12 0" stroke="#aab6c5" stroke-width="2" fill="none"/>
    </g>

    <!-- nyak -->
    <rect x="108" y="150" width="24" height="18" rx="6" fill="#c2ccd9"/>

    <!-- fej -->
    <rect x="74" y="66" width="92" height="88" rx="30" fill="url(#kl-fej)" stroke="#aab6c5" stroke-width="2"/>
    <rect x="86" y="86" width="68" height="46" rx="18" fill="url(#kl-sotet)"/>
    <g filter="url(#kl-lagy)">
      <ellipse class="szem" cx="106" cy="108" rx="8" ry="10" fill="#67e8f9"/>
      <ellipse class="szem" cx="134" cy="108" rx="8" ry="10" fill="#67e8f9"/>
    </g>
    <rect class="kl-csillan" x="112" y="86" width="16" height="46" fill="#ffffff" opacity="0.06"/>
    <path d="M104 142 q16 8 32 0" stroke="#9aa8b8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- fül-tekercsek -->
    <rect x="66" y="98" width="8" height="22" rx="4" fill="#c2ccd9"/>
    <rect x="166" y="98" width="8" height="22" rx="4" fill="#c2ccd9"/>

    <!-- antenna -->
    <line x1="120" y1="66" x2="120" y2="42" stroke="#aab6c5" stroke-width="3"/>
    <circle class="kl-antenna" cx="120" cy="36" r="6" fill="#f87171" filter="url(#kl-lagy)"/>
  </g>
</svg>
