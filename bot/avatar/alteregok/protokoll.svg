<?xml version="1.0" encoding="UTF-8"?>
<!--
  Protokoll-droid — a Csillagok háborúja C-3PO ihlette: arany, emberi arányú,
  szögletes ízületek, téglalap alakú fénylő szemek, hasi vezérlőpanel.

  Mozgás: kimért, udvarias fejbiccentés és apró karlendítés — soha nem siet.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="Protokoll-droid">
  <defs>
    <linearGradient id="pro-arany" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6a12"/>
      <stop offset="24%" stop-color="#e8c766"/>
      <stop offset="52%" stop-color="#fff6cf"/>
      <stop offset="78%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#7a5c14"/>
    </linearGradient>
    <linearGradient id="pro-lab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a5c14"/>
      <stop offset="40%" stop-color="#e0bd5c"/>
      <stop offset="100%" stop-color="#8a6a12"/>
    </linearGradient>
    <filter id="pro-lagy" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .lebeg { animation: lebeg 3.4s ease-in-out infinite; }
    @keyframes lebeg { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .szem { transform-box: fill-box; transform-origin: center; animation: pislog 5.2s ease-in-out infinite; }
    @keyframes pislog { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }

    .pro-fej { transform-box: view-box; transform-origin: 120px 110px; animation: pro-biccent 5.2s ease-in-out infinite; }
    @keyframes pro-biccent { 0%,100% { transform: rotate(-1.6deg); } 26% { transform: rotate(5deg); } 42% { transform: rotate(2.4deg); } 70% { transform: rotate(-2.4deg); } }

    .pro-kar-jobb { transform-box: view-box; transform-origin: 154px 134px; animation: pro-kar 5.2s ease-in-out infinite; }
    @keyframes pro-kar { 0%,100% { transform: rotate(0deg); } 46% { transform: rotate(-14deg); } 62% { transform: rotate(-6deg); } }

    .pro-kar-bal { transform-box: view-box; transform-origin: 86px 134px; animation: pro-kar-bal 5.2s ease-in-out infinite; }
    @keyframes pro-kar-bal { 0%,100% { transform: rotate(0deg); } 52% { transform: rotate(7deg); } }

    .pro-feny { animation: pro-feny 2.8s steps(1) infinite; }
    @keyframes pro-feny { 0%,58% { opacity: .35; } 59%,100% { opacity: 1; } }
  </style>

  <!-- talajárnyék -->
  <ellipse cx="120" cy="292" rx="56" ry="10" fill="#000" opacity="0.28"/>

  <g class="lebeg">
    <!-- lábak -->
    <rect x="99" y="200" width="17" height="56" rx="8" fill="url(#pro-lab)" stroke="#6b4f10" stroke-width="1.4"/>
    <rect x="125" y="200" width="17" height="56" rx="8" fill="url(#pro-lab)" stroke="#6b4f10" stroke-width="1.4"/>
    <circle cx="107" cy="228" r="7" fill="#c99f2a" stroke="#6b4f10" stroke-width="1.2"/>
    <circle cx="133" cy="228" r="7" fill="#c99f2a" stroke="#6b4f10" stroke-width="1.2"/>
    <rect x="90" y="252" width="32" height="15" rx="7" fill="#b8860b" stroke="#6b4f10" stroke-width="1.4"/>
    <rect x="119" y="252" width="32" height="15" rx="7" fill="#b8860b" stroke="#6b4f10" stroke-width="1.4"/>

    <!-- karok -->
    <g class="pro-kar-bal">
      <rect x="78" y="128" width="15" height="48" rx="7.5" fill="url(#pro-lab)" stroke="#6b4f10" stroke-width="1.3"/>
      <rect x="78" y="170" width="15" height="42" rx="7.5" fill="url(#pro-arany)" stroke="#6b4f10" stroke-width="1.3"/>
      <circle cx="85.5" cy="214" r="8.5" fill="#d4a017" stroke="#6b4f10" stroke-width="1.3"/>
    </g>
    <g class="pro-kar-jobb">
      <rect x="147" y="128" width="15" height="48" rx="7.5" fill="url(#pro-lab)" stroke="#6b4f10" stroke-width="1.3"/>
      <rect x="147" y="170" width="15" height="42" rx="7.5" fill="url(#pro-arany)" stroke="#6b4f10" stroke-width="1.3"/>
      <circle cx="154.5" cy="214" r="8.5" fill="#d4a017" stroke="#6b4f10" stroke-width="1.3"/>
    </g>

    <!-- törzs -->
    <rect x="93" y="120" width="54" height="88" rx="15" fill="url(#pro-arany)" stroke="#6b4f10" stroke-width="1.6"/>
    <rect x="102" y="148" width="36" height="32" rx="5" fill="#3b2f16"/>
    <rect x="106" y="154" width="11" height="6" rx="2" fill="#fbbf24" class="pro-feny"/>
    <rect x="121" y="154" width="13" height="6" rx="2" fill="#93c5fd"/>
    <rect x="106" y="165" width="28" height="5" rx="2" fill="#4ade80"/>
    <rect x="106" y="173" width="18" height="4" rx="2" fill="#f87171"/>
    <path d="M 95 188 q 25 12 50 0" stroke="#6b4f10" stroke-width="1.8" fill="none"/>
    <rect x="104" y="126" width="32" height="6" rx="3" fill="#8a6a12"/>

    <!-- nyak -->
    <rect x="111" y="104" width="18" height="20" rx="5" fill="#b8860b" stroke="#6b4f10" stroke-width="1.2"/>

    <!-- fej -->
    <g class="pro-fej">
      <ellipse cx="120" cy="76" rx="30" ry="32" fill="url(#pro-arany)" stroke="#6b4f10" stroke-width="1.6"/>
      <path d="M 92 68 q 28 -14 56 0" stroke="#fff6cf" stroke-width="2" fill="none" opacity="0.7"/>
      <rect class="szem" x="101" y="66" width="13" height="10" rx="3" fill="#16202c"/>
      <rect class="szem" x="126" y="66" width="13" height="10" rx="3" fill="#16202c"/>
      <rect x="104" y="69" width="7" height="4" rx="2" fill="#fbbf24" filter="url(#pro-lagy)"/>
      <rect x="129" y="69" width="7" height="4" rx="2" fill="#fbbf24" filter="url(#pro-lagy)"/>
      <rect x="110" y="88" width="20" height="6" rx="3" fill="#6b4f10"/>
      <rect x="113" y="90" width="14" height="2.4" rx="1.2" fill="#e8c766"/>
      <rect x="92" y="52" width="56" height="5" rx="2.5" fill="#c99f2a"/>
    </g>
  </g>
</svg>
