<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tojás — a WALL-E EVE ihlette: fehér tojásdad test, sötét "szemüveg"-sáv,
  lebegő karok, alul leváló gyűrű.

  Mozgás: magasabban lebeg, a karok összehúzódnak, a szemüveg-sáv kéken világít.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="Tojás">
  <defs>
    <linearGradient id="toj-test" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9d2dc"/>
      <stop offset="22%" stop-color="#ffffff"/>
      <stop offset="56%" stop-color="#f6f9fc"/>
      <stop offset="100%" stop-color="#bcc6d2"/>
    </linearGradient>
    <linearGradient id="toj-sav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2430"/>
      <stop offset="100%" stop-color="#2f3d4d"/>
    </linearGradient>
    <filter id="toj-lagy" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .lebeg { animation: lebeg 3.4s ease-in-out infinite; }
    @keyframes lebeg { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .szem { transform-box: fill-box; transform-origin: center; animation: pislog 5.2s ease-in-out infinite; }
    @keyframes pislog { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }

    /* EVE magasabban lebeg, mint a többi alteregó */
    .toj-emel { animation: toj-emel 3.9s ease-in-out infinite; }
    @keyframes toj-emel { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

    .toj-kar-bal { transform-box: view-box; transform-origin: 84px 176px; animation: toj-kar 3.9s ease-in-out infinite; }
    @keyframes toj-kar { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(26deg); } }

    .toj-kar-jobb { transform-box: view-box; transform-origin: 156px 176px; animation: toj-kar-j 3.9s ease-in-out infinite; }
    @keyframes toj-kar-j { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-26deg); } }

    .toj-gyuru { animation: toj-gyuru 3.9s ease-in-out infinite; }
    @keyframes toj-gyuru { 0%,100% { transform: translateY(0); opacity: .9; } 50% { transform: translateY(5px); opacity: .55; } }

    .toj-feny { animation: toj-feny 3.1s ease-in-out infinite; }
    @keyframes toj-feny { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
  </style>

  <!-- talajárnyék -->
  <ellipse cx="120" cy="292" rx="54" ry="9" fill="#000" opacity="0.26"/>

  <g class="lebeg">
    <g class="toj-emel">
      <!-- karok -->
      <g class="toj-kar-bal">
        <rect x="68" y="172" width="18" height="14" rx="7" fill="#d5dde6" stroke="#7d8894" stroke-width="1.8"/>
        <rect x="56" y="176" width="18" height="10" rx="5" fill="#bcc6d2" stroke="#7d8894" stroke-width="1.8"/>
      </g>
      <g class="toj-kar-jobb">
        <rect x="154" y="172" width="18" height="14" rx="7" fill="#d5dde6" stroke="#7d8894" stroke-width="1.8"/>
        <rect x="166" y="176" width="18" height="10" rx="5" fill="#bcc6d2" stroke="#7d8894" stroke-width="1.8"/>
      </g>

      <!-- test: tojásdad -->
      <path d="M 120 92 C 158 92 172 158 172 206 C 172 252 150 274 120 274 C 90 274 68 252 68 206 C 68 158 82 92 120 92 Z"
            fill="url(#toj-test)" stroke="#9aa5b2" stroke-width="1.7"/>

      <!-- szemüveg-sáv -->
      <path d="M 74 166 C 92 152 148 152 166 166 C 166 190 150 202 120 202 C 90 202 74 190 74 166 Z" fill="url(#toj-sav)"/>
      <ellipse class="szem toj-feny" cx="103" cy="174" rx="10" ry="12" fill="#7dd3fc" filter="url(#toj-lagy)"/>
      <ellipse class="szem toj-feny" cx="137" cy="174" rx="10" ry="12" fill="#7dd3fc" filter="url(#toj-lagy)"/>

      <!-- hasi panel és részletek -->
      <rect x="100" y="216" width="40" height="7" rx="3.5" fill="#c9d2dc"/>
      <rect x="106" y="230" width="28" height="6" rx="3" fill="#b4bfcc"/>
      <path d="M 92 120 q 28 -12 56 0" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.75"/>
      <circle cx="120" cy="252" r="5" fill="#7dd3fc" class="toj-feny" filter="url(#toj-lagy)"/>

      <!-- leváló gyűrű -->
      <g class="toj-gyuru">
        <ellipse cx="120" cy="282" rx="46" ry="10" fill="none" stroke="#c9d2dc" stroke-width="6"/>
        <ellipse cx="120" cy="282" rx="46" ry="10" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
      </g>
    </g>
  </g>
</svg>
