<?xml version="1.0" encoding="UTF-8"?>
<!--
  Asztromech — a Csillagok háborúja R2-D2 ihlette: hengeres test, gömb alakú
  fejtető, elöl kör alakú lencse, oldalt két rövid láb, a fejtetőn projektor.

  Mozgás: a fej ide-oda fordul a nyak körül, közben rövid fények villannak.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="Asztromech">
  <defs>
    <linearGradient id="asz-test" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93a1b1"/>
      <stop offset="22%" stop-color="#e6ecf3"/>
      <stop offset="52%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#bcc7d4"/>
      <stop offset="100%" stop-color="#8894a2"/>
    </linearGradient>
    <linearGradient id="asz-fej" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b9c5d3"/>
    </linearGradient>
    <filter id="asz-lagy" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .lebeg { animation: lebeg 3.4s ease-in-out infinite; }
    @keyframes lebeg { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .szem { transform-box: fill-box; transform-origin: center; animation: pislog 5.2s ease-in-out infinite; }
    @keyframes pislog { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }

    .asz-fej { transform-box: view-box; transform-origin: 120px 144px; animation: asz-forgat 4.6s ease-in-out infinite; }
    @keyframes asz-forgat { 0%,100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }

    .asz-lamp1 { animation: asz-villan 1.7s steps(1) infinite; }
    .asz-lamp2 { animation: asz-villan 1.7s steps(1) .55s infinite; }
    .asz-lamp3 { animation: asz-villan 1.7s steps(1) 1.1s infinite; }
    @keyframes asz-villan { 0%,64% { opacity: .22; } 65%,100% { opacity: 1; } }

    .asz-lencse { animation: asz-lencse 3.4s ease-in-out infinite; }
    @keyframes asz-lencse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  </style>

  <!-- talajárnyék -->
  <ellipse cx="120" cy="292" rx="58" ry="10" fill="#000" opacity="0.28"/>

  <g class="lebeg">
    <!-- oldalsó lábak -->
    <rect x="86" y="192" width="17" height="68" rx="8" fill="#c8d2dd" stroke="#7d8894" stroke-width="1.4"/>
    <rect x="137" y="192" width="17" height="68" rx="8" fill="#c8d2dd" stroke="#7d8894" stroke-width="1.4"/>
    <rect x="78" y="254" width="32" height="13" rx="6.5" fill="#8d98a5"/>
    <rect x="130" y="254" width="32" height="13" rx="6.5" fill="#8d98a5"/>
    <circle cx="94" cy="222" r="5" fill="#8d98a5"/>
    <circle cx="146" cy="222" r="5" fill="#8d98a5"/>

    <!-- test: henger -->
    <rect x="88" y="142" width="64" height="110" rx="15" fill="url(#asz-test)" stroke="#7d8894" stroke-width="1.6"/>
    <ellipse cx="120" cy="142" rx="32" ry="9" fill="#e8eef5" stroke="#7d8894" stroke-width="1.3"/>
    <rect x="96" y="160" width="48" height="30" rx="6" fill="#2b6cb0" opacity="0.85"/>
    <rect x="101" y="166" width="16" height="7" rx="3" fill="#fbbf24" class="asz-lamp1"/>
    <rect x="123" y="166" width="16" height="7" rx="3" fill="#4ade80" class="asz-lamp2"/>
    <rect x="101" y="178" width="38" height="6" rx="3" fill="#93c5fd" class="asz-lamp3"/>
    <rect x="94" y="200" width="52" height="15" rx="5" fill="#8d98a5"/>
    <circle cx="108" cy="228" r="5.5" fill="#f87171" class="asz-lamp2"/>
    <circle cx="132" cy="228" r="5.5" fill="#4ade80" class="asz-lamp1"/>
    <rect x="100" y="240" width="40" height="7" rx="3.5" fill="#9aa5b2"/>

    <!-- fej: gömb fejtető -->
    <g class="asz-fej">
      <path d="M 92 144 A 28 30 0 0 1 148 144 Z" fill="url(#asz-fej)" stroke="#7d8894" stroke-width="1.6"/>
      <ellipse cx="120" cy="144" rx="28" ry="7" fill="#dfe7ef" stroke="#7d8894" stroke-width="1.3"/>
      <circle cx="120" cy="122" r="14" fill="#16202c"/>
      <circle class="szem asz-lencse" cx="120" cy="122" r="8" fill="#67e8f9" filter="url(#asz-lagy)"/>
      <rect x="102" y="106" width="9" height="5" rx="2.5" fill="#fbbf24" class="asz-lamp1"/>
      <rect x="129" y="106" width="9" height="5" rx="2.5" fill="#f87171" class="asz-lamp2"/>
      <rect x="104" y="136" width="32" height="5" rx="2.5" fill="#8d98a5"/>
      <line x1="120" y1="104" x2="120" y2="90" stroke="#9aa5b2" stroke-width="2.6"/>
      <circle cx="120" cy="87" r="4.4" fill="#93c5fd" filter="url(#asz-lagy)"/>
    </g>
  </g>
</svg>
