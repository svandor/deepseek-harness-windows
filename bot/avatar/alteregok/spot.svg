<?xml version="1.0" encoding="UTF-8"?>
<!--
  Robotkutya — a Boston Dynamics Spot ihlette: alacsony, négylábú test, hátán
  szenzortorony, térdei hátrafelé hajlanak.

  Mozgás: lábváltogató járás, a szenzortorony körbefordul.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" role="img" aria-label="Robotkutya">
  <defs>
    <linearGradient id="sp-test" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="55%" stop-color="#f5c518"/>
      <stop offset="100%" stop-color="#b98d0d"/>
    </linearGradient>
    <linearGradient id="sp-lab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5d6570"/>
      <stop offset="50%" stop-color="#8b95a1"/>
      <stop offset="100%" stop-color="#4d545d"/>
    </linearGradient>
    <filter id="sp-lagy" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .lebeg { animation: lebeg 3.4s ease-in-out infinite; }
    @keyframes lebeg { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .szem { transform-box: fill-box; transform-origin: center; animation: pislog 5.2s ease-in-out infinite; }
    @keyframes pislog { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }

    .sp-lab-a { animation: sp-lep-a 1.4s ease-in-out infinite; }
    @keyframes sp-lep-a { 0%,50%,100% { transform: translateY(0); } 25% { transform: translateY(-9px); } }

    .sp-lab-b { animation: sp-lep-b 1.4s ease-in-out infinite; }
    @keyframes sp-lep-b { 0%,50%,100% { transform: translateY(0); } 75% { transform: translateY(-9px); } }

    .sp-torony { transform-box: view-box; transform-origin: 120px 168px; animation: sp-torony 5.6s ease-in-out infinite; }
    @keyframes sp-torony { 0%,100% { transform: rotate(-22deg); } 50% { transform: rotate(22deg); } }

    .sp-fej { transform-box: view-box; transform-origin: 186px 178px; animation: sp-fej 3.6s ease-in-out infinite; }
    @keyframes sp-fej { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
  </style>

  <!-- talajárnyék -->
  <ellipse cx="120" cy="292" rx="66" ry="10" fill="#000" opacity="0.28"/>

  <g class="lebeg">
    <!-- hátsó lábak -->
    <g class="sp-lab-b">
      <rect x="86" y="206" width="15" height="40" rx="7" fill="url(#sp-lab)" stroke="#3f4650" stroke-width="1.3"/>
      <rect x="78" y="240" width="14" height="40" rx="7" fill="#6b7480" stroke="#3f4650" stroke-width="1.3"/>
      <rect x="72" y="276" width="26" height="10" rx="5" fill="#3f4650"/>
    </g>
    <g class="sp-lab-a">
      <rect x="139" y="206" width="15" height="40" rx="7" fill="url(#sp-lab)" stroke="#3f4650" stroke-width="1.3"/>
      <rect x="148" y="240" width="14" height="40" rx="7" fill="#6b7480" stroke="#3f4650" stroke-width="1.3"/>
      <rect x="142" y="276" width="26" height="10" rx="5" fill="#3f4650"/>
    </g>

    <!-- test -->
    <rect x="66" y="170" width="108" height="46" rx="16" fill="url(#sp-test)" stroke="#8a6a0c" stroke-width="1.7"/>
    <rect x="72" y="206" width="96" height="9" rx="4.5" fill="#3f4650" opacity="0.85"/>
    <rect x="80" y="180" width="34" height="16" rx="5" fill="#3f4650" opacity="0.8"/>
    <circle cx="90" cy="188" r="4" fill="#4ade80"/>
    <circle cx="103" cy="188" r="4" fill="#fbbf24"/>

    <!-- első lábak -->
    <g class="sp-lab-a">
      <rect x="104" y="208" width="15" height="38" rx="7" fill="url(#sp-lab)" stroke="#3f4650" stroke-width="1.3"/>
      <rect x="96" y="240" width="14" height="40" rx="7" fill="#6b7480" stroke="#3f4650" stroke-width="1.3"/>
      <rect x="90" y="276" width="26" height="10" rx="5" fill="#3f4650"/>
    </g>
    <g class="sp-lab-b">
      <rect x="121" y="208" width="15" height="38" rx="7" fill="url(#sp-lab)" stroke="#3f4650" stroke-width="1.3"/>
      <rect x="130" y="240" width="14" height="40" rx="7" fill="#6b7480" stroke="#3f4650" stroke-width="1.3"/>
      <rect x="124" y="276" width="26" height="10" rx="5" fill="#3f4650"/>
    </g>

    <!-- fej -->
    <g class="sp-fej">
      <rect x="166" y="158" width="40" height="38" rx="12" fill="url(#sp-test)" stroke="#8a6a0c" stroke-width="1.7"/>
      <rect x="172" y="168" width="28" height="16" rx="6" fill="#3f4650"/>
      <ellipse class="szem" cx="180" cy="176" rx="4.4" ry="5.4" fill="#67e8f9" filter="url(#sp-lagy)"/>
      <ellipse class="szem" cx="192" cy="176" rx="4.4" ry="5.4" fill="#67e8f9" filter="url(#sp-lagy)"/>
      <rect x="172" y="188" width="28" height="4" rx="2" fill="#8a6a0c"/>
      <line x1="204" y1="166" x2="214" y2="156" stroke="#6b7480" stroke-width="3" stroke-linecap="round"/>
      <circle cx="216" cy="153" r="3.6" fill="#67e8f9" filter="url(#sp-lagy)"/>
    </g>

    <!-- szenzortorony -->
    <g class="sp-torony">
      <rect x="108" y="140" width="24" height="32" rx="7" fill="#6b7480" stroke="#3f4650" stroke-width="1.4"/>
      <rect x="104" y="132" width="32" height="12" rx="5" fill="#3f4650"/>
      <circle cx="120" cy="138" r="4.6" fill="#f87171" filter="url(#sp-lagy)"/>
      <line x1="120" y1="132" x2="120" y2="118" stroke="#6b7480" stroke-width="2.4"/>
      <circle cx="120" cy="115" r="3.4" fill="#4ade80"/>
    </g>
  </g>
</svg>
